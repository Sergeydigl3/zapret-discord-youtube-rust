# Integration with release-please:
# - release-please creates the draft GitHub Release + tag
# - This workflow triggers on the tag push, runs build.yml (cargo zigbuild),
#   and uploads the compiled binaries directly to the GitHub Release using gh CLI.

name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
      - '[0-9]+.[0-9]+.[0-9]+*'

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      upload-artifacts: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build outputs
        uses: actions/download-artifact@v4
        with:
          pattern: build-artifacts-*
          merge-multiple: true

      - name: Upload artifacts to GitHub Release
        run: |
          gh release upload ${{ github.ref_name }} zapret-rust-* --clobber
          gh release edit ${{ github.ref_name }} --draft=false
