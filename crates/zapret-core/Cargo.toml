[package]
name = "zapret-core"
version = "2.1.0"
edition = "2021"
license = "MIT"
description = "Domain logic of zapret-rust: paths, processes, config, firewall backends, strategies, service managers and autotune probes."

[dependencies]
nix = { version = "0.27", features = ["signal", "user"] }
regex = "1.10.2"
nftables = "0.6.3"
serde_json = "1.0"
ureq = "2.9.1"
tar = "0.4.46"
flate2 = "1.1.9"
zip = "8.6.0"
sys-locale = "0.3.2"
rust-i18n = "4.1.0"
aes = "0.8"
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
windows-service = "0.6.0"
