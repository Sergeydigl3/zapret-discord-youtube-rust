[package]
name = "zapret-core"
version = "2.1.0"
edition = "2021"
license = "MIT"
description = "Launch kernel of zapret-rust: the zapret daemon process lifecycle and the firewall backends it runs behind. Knows nothing about strategies, configuration files or paths."

[dependencies]
nftables = "0.6.3"
serde_json = "1.0"
rust-i18n = "4.1.0"
# Still needed by the modules that move to zapret-wrapper in the next step.
nix = { version = "0.27", features = ["signal", "user"] }
regex = "1.10.2"
sys-locale = "0.3.2"
aes = "0.8"
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
windows-service = "0.6.0"
