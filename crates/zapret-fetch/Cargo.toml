[package]
name = "zapret-fetch"
version = "2.1.0"
edition = "2021"
license = "MIT"
description = "Fetches and installs the zapret runtime binary and the strategy repository into caller-supplied directories. Depends on neither zapret-core nor zapret-wrapper."

[dependencies]
ureq = "2.9.1"
serde_json = "1.0"
tar = "0.4.46"
flate2 = "1.1.9"
zip = "8.6.0"
rust-i18n = "4.1.0"
